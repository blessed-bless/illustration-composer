<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор иллюстраций</title><link rel="stylesheet" href="style.css"></head><body>
<aside>
 <h1>Конструктор иллюстраций</h1>
 <section><h2>Автосборка</h2>
  <div class="seg"><label><input type="radio" name="sc" value="metaphor" checked> Метафора</label><label><input type="radio" name="sc" value="names"> Компоненты</label></div>
  <textarea id="prompt" rows="3" placeholder="Например: «обучение и новые знания»"></textarea>
  <label class="chk"><input type="checkbox" id="useBg" checked> Фоновые объекты</label>
  <div class="row"><button id="gen" class="primary">Собрать</button><button id="shuffle" title="Новая раскладка">Перемешать</button></div>
  <p id="notes" class="hint"></p></section>
 <section><h2>Параметры</h2>
  <div class="row"><span>Размер</span><div class="seg"><label><input type="radio" name="sz" value="L" checked> L</label><label><input type="radio" name="sz" value="S"> S</label></div></div>
  <div class="row"><span>Палитра</span><select id="pal"></select></div>
  <div class="row"><span></span><label class="file">Загрузить палитру (JSON)<input type="file" id="palFile" accept=".json,application/json"></label></div>
  <div class="row"><span>Холст</span><select id="cv"><option value="800x600">800 × 600</option><option value="1080x1080">1080 × 1080</option><option value="1200x628">1200 × 628</option><option value="600x800">600 × 800</option></select></div>
  <div class="row"><span>Масштаб</span><input type="range" id="gs" min="0.5" max="1.6" step="0.05" value="1"></div></section>
 <section><h2>Библиотека <small id="cnt"></small></h2><div id="lib"></div>
  <label class="file">+ Добавить SVG<input type="file" id="svgFile" accept=".svg,image/svg+xml" multiple></label></section>
</aside>
<main>
 <div id="bar">
  <button data-a="rl" title="Повернуть −15°">⟲</button><button data-a="rr" title="Повернуть +15°">⟳</button>
  <button data-a="dup">Дубль</button><button data-a="del">Удалить</button>
  <button data-a="up" title="Выше">▲ слой</button><button data-a="down" title="Ниже">▼ слой</button>
  <button data-a="mode">Главный ⇄ фон</button><span class="sp"></span><button id="clear">Очистить</button><button id="export" class="primary">Скачать SVG</button>
 </div>
 <div id="stage"><svg id="cvs" xmlns="http://www.w3.org/2000/svg"></svg></div>
</main>
<script type="module" src="src/app.js"></script></body></html>
